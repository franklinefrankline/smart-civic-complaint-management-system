{% extends "base.html" %}

{% block title %}Field Worker Profile | {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="dashboard-layout">
  {% include 'shared/_sidebar.html' %}

  <div class="dashboard-content" style="max-width: 650px;">
    <div style="margin-bottom: 1.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem;">
      <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 0.25rem;">
        Technician Account
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em;">
        Field Worker Profile
      </h1>
      <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.2rem;">
        Manage your contact information and technician credentials.
      </p>
    </div>

    <div class="card" style="padding: 2rem; box-shadow: none;">
      <form method="POST" action="{{ url_for('worker.profile') }}">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Email (Locked)</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled style="background: var(--bg-subtle);">
          </div>
          <div class="form-group">
            <label class="form-label">Mobile (Locked)</label>
            <input type="tel" class="form-control" value="{{ user.mobile_number }}" disabled style="background: var(--bg-subtle);">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Assigned Department</label>
          <input type="text" class="form-control" value="{{ user.department.name if user.department else 'Field Maintenance Wing' }}" disabled style="background: var(--bg-subtle);">
        </div>

        <div class="form-group" style="padding-top: 1rem; border-top: 1px solid var(--border-color);">
          <label class="form-label">Change Password (leave blank to keep current)</label>
          <div class="password-input-wrapper">
            <input type="password" name="new_password" class="form-control" placeholder="New secure password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this)" aria-label="Toggle password visibility" title="Show or hide password" tabindex="-1">
              <i data-lucide="eye" class="icon-sm"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
