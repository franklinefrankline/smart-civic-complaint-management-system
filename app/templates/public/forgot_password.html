{% extends "base.html" %}

{% block title %}Forgot Password | {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; max-width: 440px;">
  <div class="card" style="padding: 2.25rem; border-top: 4px solid var(--civic-blue);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary);">
        {{ tr('Reset Password') }}
      </h2>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.25rem;">
        {{ tr('Enter your registered email address or mobile number to receive password recovery instructions.') }}
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label class="form-label">{{ tr('Registered Email or Mobile Number') }}</label>
        <input type="text" name="login_id" class="form-control" required placeholder="{{ tr('e.g. citizen@example.com') }}">
      </div>

      <button type="submit" class="btn btn-primary w-full" style="padding: 0.75rem;">
        {{ tr('Send Recovery Instructions') }} &rarr;
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="{{ url_for('auth.login') }}" style="font-size: 0.88rem; font-weight: 600;">
        &larr; {{ tr('Back to Sign In') }}
      </a>
    </div>
  </div>
</div>
{% endblock %}
