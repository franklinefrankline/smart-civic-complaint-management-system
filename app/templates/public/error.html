{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center; max-width: 600px;">
  <div style="font-size: 4rem; font-weight: 800; color: var(--civic-blue); margin-bottom: 1rem;">
    {{ code }}
  </div>
  <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-primary);">
    {{ title }}
  </h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.05rem;">
    {{ message }}
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Homepage</a>
    <button type="button" class="btn btn-secondary" data-back-nav data-fallback-url="{{ url_for('public.index') }}">Go Back</button>
  </div>
</div>
{% endblock %}
