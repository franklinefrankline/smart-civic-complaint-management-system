{% extends "base.html" %}

{% block title %}Officer Profile | {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="dashboard-layout">
  {% include 'shared/_sidebar.html' %}

  <div class="dashboard-content">
    <div style="margin-bottom: 1.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem;">
      <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--civic-teal); letter-spacing: 0.05em; margin-bottom: 0.25rem;">
        Officer Account
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em;">
        Officer Profile & Credentials
      </h1>
      <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.2rem;">
        View official municipal designation and manage your access password.
      </p>
    </div>

    <div class="card" style="padding: 2rem; box-shadow: none;">
      <form method="POST" action="{{ url_for('officer.profile') }}">
        <div class="form-group">
          <label class="form-label">Full Official Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Email Address (Locked)</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled style="background: var(--bg-subtle);">
          </div>
          <div class="form-group">
            <label class="form-label">Mobile Number (Locked)</label>
            <input type="tel" class="form-control" value="{{ user.mobile_number }}" disabled style="background: var(--bg-subtle);">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Assigned Civic Department</label>
          <input type="text" class="form-control" value="{{ user.department.name if user.department else 'Unassigned' }}" disabled style="background: var(--bg-subtle);">
        </div>

        <div class="form-group" style="padding-top: 1rem; border-top: 1px solid var(--border-color);">
          <label class="form-label">Update Access Password (leave blank to retain current)</label>
          <div class="password-input-wrapper">
            <input type="password" name="new_password" class="form-control" placeholder="New secure password (minimum 8 characters)">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this)" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="icon-sm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">
            Save Profile Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
